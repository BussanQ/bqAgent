<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#030711" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<title>bqagent</title>
<style>
  :root,
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #030711;
    --bg-soft: #071426;
    --panel: rgba(7, 20, 38, .78);
    --panel-strong: rgba(10, 27, 50, .94);
    --header-bg: rgba(3, 7, 17, .86);
    --footer-bg: rgba(3, 7, 17, .96);
    --footer-mid: rgba(3, 7, 17, .60);
    --line: rgba(123, 231, 255, .16);
    --line-strong: rgba(53, 184, 255, .44);
    --text: #eaf7ff;
    --text-soft: #a9c7d9;
    --text-muted: #6f96ae;
    --signal: #35b8ff;
    --stream: #7be7ff;
    --signal-rgb: 53, 184, 255;
    --stream-rgb: 123, 231, 255;
    --progress: #ffc857;
    --progress-rgb: 255, 200, 87;
    --danger: #ff5c75;
    --danger-rgb: 255, 92, 117;
    --shadow: 0 22px 70px rgba(0, 0, 0, .52);
    --bubble-user: rgba(16, 44, 78, .92);
    --bubble-shadow: 0 14px 34px rgba(0, 0, 0, .20);
    --sidebar-shadow: -18px 0 50px rgba(0, 0, 0, .16);
    --overlay-shadow: 0 24px 80px rgba(0, 0, 0, .42);
    --scrim: rgba(1, 5, 12, .62);
    --code-bg: #020914;
    --quote-bg: rgba(53, 184, 255, .06);
    --table-head: rgba(53, 184, 255, .10);
    --particle-dot: #dff7ff;
    --particle-link: 91, 199, 255;
    --particle-static: rgba(53, 184, 255, .20);
    --particle-strength: 1;
    --surface-subtle: rgba(53, 184, 255, .04);
    --surface-hover: rgba(53, 184, 255, .07);
    --surface-active: rgba(53, 184, 255, .10);
    --surface-danger: rgba(255, 92, 117, .07);
    --surface-progress: rgba(255, 200, 87, .07);
    --surface-media: rgba(0, 0, 0, .10);
    --emblem-glow: rgba(53, 184, 255, .14);
    --slider-dot: rgba(255, 255, 255, .38);
    --slider-thumb: #fff;
    --slider-thumb-line: rgba(255, 255, 255, .88);
    --select-bg: #0a1b32;
    --select-active: #123d61;
    --text-glow: 0 0 8px rgba(53, 184, 255, .20);
    --vignette-rgb: 0, 0, 0;
    --grid-fade: 72%;
    --ambient-primary: .12;
    --ambient-secondary: .08;
    --ambient-tertiary: .04;
    --ambient-vignette: .55;
    --grid-opacity: .06;
    --scan-opacity: .02;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --font-body: 16px/1.6;
    --font-ui: 13px;
    --font-small: 12px;
    --font-tiny: 11px;
    --maxw: 1080px;
    --workspace-width: clamp(240px, 20.8vw, 336px);
    --conversation-width: clamp(220px, 18vw, 280px);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light;
      --bg: #e6ecf5;
      --bg-soft: #f2f5fa;
      --panel: rgba(255, 255, 255, .70);
      --panel-strong: rgba(255, 255, 255, .88);
      --header-bg: rgba(240, 244, 250, .80);
      --footer-bg: rgba(230, 236, 245, .94);
      --footer-mid: rgba(230, 236, 245, .55);
      --line: rgba(23, 51, 89, .13);
      --line-strong: rgba(47, 111, 235, .30);
      --text: #17222f;
      --text-soft: #44586e;
      --text-muted: #6d829a;
      --signal: #2f6feb;
      --stream: #0e8ea8;
      --signal-rgb: 47, 111, 235;
      --stream-rgb: 14, 142, 168;
      --progress: #b0730c;
      --progress-rgb: 176, 115, 12;
      --danger: #d92d3f;
      --danger-rgb: 217, 45, 63;
      --shadow: 0 18px 44px rgba(23, 51, 89, .12);
      --bubble-user: rgba(224, 234, 251, .92);
      --bubble-shadow: 0 10px 26px rgba(23, 51, 89, .08);
      --sidebar-shadow: -18px 0 46px rgba(23, 51, 89, .10);
      --overlay-shadow: 0 24px 64px rgba(23, 51, 89, .18);
      --scrim: rgba(23, 40, 66, .34);
      --code-bg: #f3f6fc;
      --quote-bg: rgba(47, 111, 235, .07);
      --table-head: rgba(47, 111, 235, .08);
      --particle-dot: rgba(38, 74, 128, .52);
      --particle-link: 47, 111, 235;
      --particle-static: rgba(38, 74, 128, .26);
      --particle-strength: 1.7;
      --surface-subtle: rgba(47, 111, 235, .05);
      --surface-hover: rgba(47, 111, 235, .09);
      --surface-active: rgba(47, 111, 235, .13);
      --surface-danger: rgba(217, 45, 63, .07);
      --surface-progress: rgba(176, 115, 12, .09);
      --surface-media: rgba(23, 51, 89, .05);
      --emblem-glow: rgba(47, 111, 235, .16);
      --slider-dot: rgba(23, 51, 89, .26);
      --slider-thumb: #fff;
      --slider-thumb-line: rgba(47, 111, 235, .55);
      --select-bg: #ffffff;
      --select-active: #dbe8fb;
      --text-glow: none;
      --vignette-rgb: 33, 56, 92;
      --grid-fade: 58%;
      --ambient-primary: .10;
      --ambient-secondary: .08;
      --ambient-tertiary: .05;
      --ambient-vignette: .09;
      --grid-opacity: .05;
      --scan-opacity: .012;
    }
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #e6ecf5;
    --bg-soft: #f2f5fa;
    --panel: rgba(255, 255, 255, .70);
    --panel-strong: rgba(255, 255, 255, .88);
    --header-bg: rgba(240, 244, 250, .80);
    --footer-bg: rgba(230, 236, 245, .94);
    --footer-mid: rgba(230, 236, 245, .55);
    --line: rgba(23, 51, 89, .13);
    --line-strong: rgba(47, 111, 235, .30);
    --text: #17222f;
    --text-soft: #44586e;
    --text-muted: #6d829a;
    --signal: #2f6feb;
    --stream: #0e8ea8;
    --signal-rgb: 47, 111, 235;
    --stream-rgb: 14, 142, 168;
    --progress: #b0730c;
    --progress-rgb: 176, 115, 12;
    --danger: #d92d3f;
    --danger-rgb: 217, 45, 63;
    --shadow: 0 18px 44px rgba(23, 51, 89, .12);
    --bubble-user: rgba(224, 234, 251, .92);
    --bubble-shadow: 0 10px 26px rgba(23, 51, 89, .08);
    --sidebar-shadow: -18px 0 46px rgba(23, 51, 89, .10);
    --overlay-shadow: 0 24px 64px rgba(23, 51, 89, .18);
    --scrim: rgba(23, 40, 66, .34);
    --code-bg: #f3f6fc;
    --quote-bg: rgba(47, 111, 235, .07);
    --table-head: rgba(47, 111, 235, .08);
    --particle-dot: rgba(38, 74, 128, .52);
    --particle-link: 47, 111, 235;
    --particle-static: rgba(38, 74, 128, .26);
    --particle-strength: 1.7;
    --surface-subtle: rgba(47, 111, 235, .05);
    --surface-hover: rgba(47, 111, 235, .09);
    --surface-active: rgba(47, 111, 235, .13);
    --surface-danger: rgba(217, 45, 63, .07);
    --surface-progress: rgba(176, 115, 12, .09);
    --surface-media: rgba(23, 51, 89, .05);
    --emblem-glow: rgba(47, 111, 235, .16);
    --slider-dot: rgba(23, 51, 89, .26);
    --slider-thumb: #fff;
    --slider-thumb-line: rgba(47, 111, 235, .55);
    --select-bg: #ffffff;
    --select-active: #dbe8fb;
    --text-glow: none;
    --vignette-rgb: 33, 56, 92;
    --grid-fade: 58%;
    --ambient-primary: .10;
    --ambient-secondary: .08;
    --ambient-tertiary: .05;
    --ambient-vignette: .09;
    --grid-opacity: .05;
    --scan-opacity: .012;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-width: 320px;
    background:
      radial-gradient(circle at 12% -8%, rgba(var(--signal-rgb), var(--ambient-primary)), transparent 30%),
      radial-gradient(circle at 88% 10%, rgba(var(--stream-rgb), var(--ambient-secondary)), transparent 26%),
      radial-gradient(ellipse at 50% 0%, rgba(var(--signal-rgb), var(--ambient-tertiary)), transparent 55%),
      radial-gradient(circle at 50% 50%, transparent 55%, rgba(var(--vignette-rgb), var(--ambient-vignette)) 100%),
      linear-gradient(135deg, var(--bg), var(--bg-soft) 52%, var(--bg));
    color: var(--text);
    font: var(--font-body) ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(var(--signal-rgb), var(--grid-opacity)) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--signal-rgb), var(--grid-opacity)) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .55), transparent var(--grid-fade));
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(var(--signal-rgb), var(--scan-opacity)) 50%, transparent 50%);
    background-size: 100% 4px;
    opacity: .55;
  }

  #particle-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  .scanline {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background: linear-gradient(to bottom, transparent, rgba(var(--signal-rgb),.03), transparent);
    background-size: 100% 6px;
    opacity: .35;
    animation: scanline 8s linear infinite;
  }
  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    border: 3px solid transparent;
    border-radius: 999px;
    background-color: rgba(var(--signal-rgb), .26);
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(var(--signal-rgb), .42); }

  button, textarea { font: inherit; }
  button {
    cursor: pointer;
    border: 1px solid var(--line);
    color: var(--text);
    background: var(--panel);
    transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
  }
  button:hover {
    transform: translateY(-1px);
    border-color: var(--line-strong);
    box-shadow: 0 12px 32px rgba(var(--signal-rgb),.12);
  }
  button:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }
  button:disabled { opacity: .48; cursor: not-allowed; transform: none; box-shadow: none; }
  .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
  .ui-icon { width: 1em; height: 1em; display: inline-block; flex: 0 0 auto; overflow: visible; vertical-align: -.125em; }
  .button-with-icon { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .button-with-icon > .ui-icon { width: 15px; height: 15px; }

  header {
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px clamp(16px, 3vw, 28px);
    border-bottom: 1px solid var(--line);
    background: var(--header-bg);
    backdrop-filter: blur(20px);
  }

  .brand { flex: 1 1 auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark {
    width: 36px;
    height: 36px;
    flex: 0 0 auto;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background:
      radial-gradient(circle at 50% 50%, var(--emblem-glow), transparent 60%),
      var(--panel-strong);
    box-shadow: inset 0 0 18px rgba(var(--signal-rgb),.10), 0 0 26px rgba(var(--signal-rgb),.12);
    position: relative;
  }
  .mark::before,
  .mark::after {
    content: "";
    position: absolute;
  }
  .mark::before {
    inset: 8px;
    border-radius: 50%;
    border: 2px solid rgba(var(--signal-rgb),.55);
    border-right-color: transparent;
    animation: markSpin 4s linear infinite;
  }
  .mark::after {
    width: 7px;
    height: 7px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 16px var(--signal);
  }
  @keyframes markSpin { 100% { transform: rotate(360deg); } }
  .brand-text { min-width: 0; }
  .brand h1 {
    margin: 0;
    font-size: 18px;
    line-height: 1.2;
    letter-spacing: -.02em;
    font-weight: 720;
  }
  .brand span {
    display: block;
    color: var(--text-muted);
    font-size: var(--font-small);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand span::before {
    content: "> ";
    color: var(--signal);
  }

  .actions { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    color: var(--text-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-subtle);
    font-size: var(--font-small);
    white-space: nowrap;
  }
  .status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 14px var(--signal);
  }
  .status.busy::before {
    background: var(--stream);
    box-shadow: 0 0 14px var(--stream);
    animation: statusPulse 1.15s ease-in-out infinite;
  }
  .status.error::before { background: var(--danger); box-shadow: 0 0 14px var(--danger); }
  @keyframes statusPulse { 50% { opacity: .35; transform: scale(.72); } }
  .ghost {
    height: 36px;
    padding: 0 13px;
    border-radius: var(--radius-pill);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    font-size: var(--font-ui);
    font-weight: 650;
  }
  .ghost .ui-icon { width: 17px; height: 17px; color: var(--signal); }
  .icon-button {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--panel);
  }
  .icon-button svg { width: 17px; height: 17px; }

  .workspace-toggle { color: var(--text-soft); }
  .workspace-toggle[aria-expanded="true"] {
    color: var(--signal);
    border-color: var(--line-strong);
    background: var(--surface-active);
  }

  .app-layout {
    position: relative;
    z-index: 1;
    min-height: 0;
    flex: 1 1 auto;
    display: flex;
    overflow: hidden;
  }
  .conversation-column {
    min-width: 0;
    min-height: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }
  .workspace-sidebar {
    position: relative;
    z-index: 4;
    order: 2;
    width: var(--workspace-width);
    min-width: var(--workspace-width);
    min-height: 0;
    flex: 0 0 var(--workspace-width);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-left: 1px solid var(--line);
    background: var(--panel-strong);
    box-shadow: var(--sidebar-shadow);
    backdrop-filter: blur(22px);
    transition: margin-right .22s cubic-bezier(.22, .8, .28, 1), transform .22s cubic-bezier(.22, .8, .28, 1);
  }
  .app-layout.workspace-closed .workspace-sidebar { margin-right: calc(0px - var(--workspace-width)); }
  .workspace-backdrop[hidden] { display: none; }
  .workspace-backdrop { display: none; }
  .workspace-view {
    min-height: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }
  .workspace-view[hidden] { display: none; }
  .workspace-toolbar {
    min-height: 58px;
    flex: 0 0 auto;
    padding: 10px 11px 9px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-subtle);
  }
  .workspace-heading { min-width: 0; flex: 1 1 auto; }
  .workspace-heading strong {
    display: block;
    overflow: hidden;
    color: var(--text);
    font: 700 13px/1.35 ui-sans-serif, system-ui, sans-serif;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .workspace-heading span {
    display: block;
    overflow: hidden;
    margin-top: 2px;
    color: var(--text-muted);
    font: 11px/1.3 ui-sans-serif, system-ui, sans-serif;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .workspace-tool {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 9px;
    color: var(--text-soft);
    background: transparent;
  }
  .workspace-tool svg { width: 15px; height: 15px; }
  .workspace-tree-scroll {
    min-height: 0;
    flex: 1 1 auto;
    overflow: auto;
    overscroll-behavior: contain;
    padding: 8px 7px 16px;
    scrollbar-color: rgba(var(--signal-rgb), .28) transparent;
  }
  .workspace-tree-status {
    min-height: 22px;
    padding: 4px 8px 7px;
    color: var(--text-muted);
    font: 12px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  .workspace-tree-status:empty { display: none; }
  .workspace-tree-status.error { color: var(--danger); }
  .workspace-tree { min-width: 0; }
  .workspace-row,
  .workspace-load-more {
    width: 100%;
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px 6px calc(7px + var(--tree-depth, 0) * 16px);
    border-color: transparent;
    border-radius: 8px;
    color: var(--text-soft);
    background: transparent;
    box-shadow: none;
    text-align: left;
  }
  .workspace-row:hover,
  .workspace-load-more:hover {
    transform: none;
    border-color: rgba(var(--signal-rgb), .16);
    background: var(--surface-hover);
    box-shadow: none;
  }
  .workspace-row:disabled { opacity: .62; cursor: default; }
  .workspace-row:disabled:hover { border-color: transparent; background: transparent; }
  .workspace-row.active {
    color: var(--text);
    border-color: rgba(var(--signal-rgb), .25);
    background: var(--surface-active);
  }
  .workspace-chevron {
    width: 10px;
    flex: 0 0 10px;
    color: var(--signal);
    font-size: 10px;
    transition: transform .15s ease;
  }
  .workspace-chevron.expanded { transform: rotate(90deg); }
  .workspace-entry-icon {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    color: var(--signal);
  }
  .workspace-entry-icon svg { width: 100%; height: 100%; display: block; }
  .workspace-entry-icon.muted { color: var(--text-muted); }
  .workspace-entry-name {
    min-width: 0;
    flex: 1 1 auto;
    overflow: hidden;
    font: 12px/1.4 ui-sans-serif, system-ui, sans-serif;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .workspace-entry-size {
    flex: 0 0 auto;
    color: var(--text-muted);
    font: 10px/1 ui-sans-serif, system-ui, sans-serif;
  }
  .workspace-load-more {
    justify-content: center;
    color: var(--signal);
    font: 10px/1.3 ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  .workspace-inline-state {
    padding: 5px 8px 5px calc(30px + var(--tree-depth, 0) * 16px);
    color: var(--text-muted);
    font: 10px/1.4 ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  .workspace-inline-state.error { color: var(--danger); }
  .workspace-preview-scroll {
    min-height: 0;
    flex: 1 1 auto;
    overflow: auto;
    overscroll-behavior: contain;
    padding: 14px;
  }
  .workspace-preview-meta {
    margin-bottom: 12px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text-muted);
    background: var(--surface-subtle);
    font: 10px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .workspace-preview-content { min-height: 100px; }
  .workspace-preview-content pre {
    min-width: 100%;
    width: max-content;
    max-width: none;
    margin: 0;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    background: var(--code-bg);
    font: 11px/1.55 ui-monospace, "SFMono-Regular", Consolas, monospace;
    white-space: pre;
  }
  .workspace-preview-content img {
    display: block;
    width: auto;
    max-width: 100%;
    max-height: 60vh;
    margin: 0 auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-media);
    object-fit: contain;
  }
  .workspace-preview-message {
    padding: 22px 14px;
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
    color: var(--text-soft);
    background: var(--surface-subtle);
    text-align: center;
    overflow-wrap: anywhere;
  }
  .workspace-preview-message.error { color: var(--danger); border-color: rgba(var(--danger-rgb), .42); }
  .workspace-preview-truncated {
    margin: 10px 0 0;
    color: var(--progress);
    font: 10px/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace;
  }

  var runtimeModelLoadID = 0;

  var workspaceRefreshInFlight = false;

  var PARTICLE_MAX_COUNT = 80;
  var PARTICLE_TARGET_FPS = 30;
  var PARTICLE_FRAME_INTERVAL = 1000 / PARTICLE_TARGET_FPS;
  var PARTICLE_LINK_DISTANCE = 100;
  var PARTICLE_MOUSE_RADIUS = 140;
  var PARTICLE_TRAIL_MAX_POINTS = 8;
  var PARTICLE_TRAIL_LIFETIME = 360;
  var PARTICLE_TRAIL_MIN_DISTANCE = 16;
  var PARTICLE_TRAIL_SAMPLE_INTERVAL = 40;
  var PARTICLE_PULSE_MAX_COUNT = 3;
  var PARTICLE_PULSE_LIFETIME = 520;
  var PARTICLE_PULSE_MAX_RADIUS = 96;
  var particleContext = null;
  var particles = [];
  var particleBuckets = Object.create(null);
  var particleTrailPoints = [];
  var particlePulses = [];
  var particleTrailLast = { x: 0, y: 0, time: 0 };
  var particleWidth = 0;
  var particleHeight = 0;
  var particleDpr = 1;
  var particleFrame = 0;
  var particleResizeFrame = 0;
  var particleLastFrameTime = 0;
  var particleRunning = false;
  var particlePalette = { dot: "#dff7ff", link: "91, 199, 255", staticDot: "rgba(53, 184, 255, .20)", strength: 1 };
  var particleMouse = { x: 0, y: 0, active: false };
  var finePointerQuery = window.matchMedia ? window.matchMedia("(hover: hover) and (pointer: fine)") : null;
  var reducedMotionQuery = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

  function listenMediaQuery(query, handler) {
    if (!query) return;
    if (typeof query.addEventListener === "function") query.addEventListener("change", handler);
    else if (typeof query.addListener === "function") query.addListener(handler);
  }

  function randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function refreshParticlePalette() {
    if (!particleCanvas) return;
    var styles = getComputedStyle(document.documentElement);
    particlePalette.dot = styles.getPropertyValue("--particle-dot").trim() || "#dff7ff";
    particlePalette.link = styles.getPropertyValue("--particle-link").trim() || "91, 199, 255";
    particlePalette.staticDot = styles.getPropertyValue("--particle-static").trim() || "rgba(53, 184, 255, .20)";
    var strength = parseFloat(styles.getPropertyValue("--particle-strength"));
    particlePalette.strength = isFinite(strength) && strength > 0 ? strength : 1;
  }

  function particleAlpha(base) {
    return Math.min(1, base * particlePalette.strength);
  }

  function targetParticleCount() {
    return Math.min(PARTICLE_MAX_COUNT, Math.max(36, Math.min(72,
      Math.round((particleWidth * particleHeight) / 12000))));
  }

  function createParticle() {
    var angle = Math.random() * Math.PI * 2;
    var speed = randomBetween(7, 18);
    var vx = Math.cos(angle) * speed;
    var vy = Math.sin(angle) * speed;
    return {
      x: Math.random() * particleWidth,
      y: Math.random() * particleHeight,
      vx: vx,
      vy: vy,
      baseVx: vx,
      baseVy: vy,
      radius: randomBetween(1, 1.8)
    };
  }

  function syncParticleCount() {
    var target = targetParticleCount();
    while (particles.length < target) particles.push(createParticle());
    if (particles.length > target) particles.length = target;
  }

  function resizeParticleField() {
    if (!particleCanvas || !particleContext) return;
    var previousWidth = particleWidth || window.innerWidth;
    var previousHeight = particleHeight || window.innerHeight;
    particleWidth = Math.max(1, window.innerWidth);
    particleHeight = Math.max(1, window.innerHeight);
    particleDpr = Math.min(window.devicePixelRatio || 1, 1.5);
    particleCanvas.width = Math.max(1, Math.floor(particleWidth * particleDpr));
    particleCanvas.height = Math.max(1, Math.floor(particleHeight * particleDpr));
    particleContext.setTransform(particleDpr, 0, 0, particleDpr, 0, 0);
    particles.forEach(function (particle) {
      particle.x = particle.x / previousWidth * particleWidth;
      particle.y = particle.y / previousHeight * particleHeight;
    });
    syncParticleCount();
    resetParticleInteractions();
    drawParticleField(0, false);
  }

  function buildParticleBuckets() {
    particleBuckets = Object.create(null);
    particles.forEach(function (particle, index) {
      var cellX = Math.floor(particle.x / PARTICLE_LINK_DISTANCE);
      var cellY = Math.floor(particle.y / PARTICLE_LINK_DISTANCE);
      var key = cellX + ":" + cellY;
      if (!particleBuckets[key]) particleBuckets[key] = [];
      particleBuckets[key].push(index);
    });
  }

  function updateParticle(particle, dt) {
    particle.vx += (particle.baseVx - particle.vx) * Math.min(1, dt * .7);
    particle.vy += (particle.baseVy - particle.vy) * Math.min(1, dt * .7);
    if (particleMouse.active) {
      var dx = particleMouse.x - particle.x;
      var dy = particleMouse.y - particle.y;
      var distanceSquared = dx * dx + dy * dy;
      if (distanceSquared > 1 && distanceSquared < PARTICLE_MOUSE_RADIUS * PARTICLE_MOUSE_RADIUS) {
        var distance = Math.sqrt(distanceSquared);
        var force = (1 - distance / PARTICLE_MOUSE_RADIUS) * 18;
        particle.vx += dx / distance * force * dt;
        particle.vy += dy / distance * force * dt;
      }
    }
    var speed = Math.sqrt(particle.vx * particle.vx + particle.vy * particle.vy);
    if (speed > 28) {
      particle.vx = particle.vx / speed * 28;
      particle.vy = particle.vy / speed * 28;
    }
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    if (particle.x < -2) particle.x = particleWidth + 2;
    else if (particle.x > particleWidth + 2) particle.x = -2;
    if (particle.y < -2) particle.y = particleHeight + 2;
    else if (particle.y > particleHeight + 2) particle.y = -2;
  }

  function drawParticleLinks() {
    var maxDistanceSquared = PARTICLE_LINK_DISTANCE * PARTICLE_LINK_DISTANCE;
    particles.forEach(function (particle, index) {
      var cellX = Math.floor(particle.x / PARTICLE_LINK_DISTANCE);
      var cellY = Math.floor(particle.y / PARTICLE_LINK_DISTANCE);
      for (var offsetY = -1; offsetY <= 1; offsetY++) {
        for (var offsetX = -1; offsetX <= 1; offsetX++) {
          var bucket = particleBuckets[(cellX + offsetX) + ":" + (cellY + offsetY)] || [];
          bucket.forEach(function (otherIndex) {
            if (otherIndex <= index) return;
            var other = particles[otherIndex];
            var dx = other.x - particle.x;
            var dy = other.y - particle.y;
            var distanceSquared = dx * dx + dy * dy;
            if (distanceSquared >= maxDistanceSquared) return;
            var alpha = particleAlpha((1 - distanceSquared / maxDistanceSquared) * .20);
            particleContext.beginPath();
            particleContext.moveTo(particle.x, particle.y);
            particleContext.lineTo(other.x, other.y);
            particleContext.strokeStyle = "rgba(" + particlePalette.link + "," + alpha + ")";
            particleContext.lineWidth = .65;
            particleContext.stroke();
          });
        }
      }
    });
  }

  function resetParticleInteractions() {
    particleTrailPoints.length = 0;
    particlePulses.length = 0;
    particleTrailLast.x = 0;
    particleTrailLast.y = 0;
    particleTrailLast.time = 0;
  }

  function addParticleTrailPoint(x, y, now) {
    var dx = x - particleTrailLast.x;
    var dy = y - particleTrailLast.y;
    var elapsed = now - particleTrailLast.time;
    if (particleTrailLast.time && dx * dx + dy * dy < PARTICLE_TRAIL_MIN_DISTANCE * PARTICLE_TRAIL_MIN_DISTANCE &&
        elapsed < PARTICLE_TRAIL_SAMPLE_INTERVAL) return;
    particleTrailPoints.push({ x: x, y: y, createdAt: now });
    if (particleTrailPoints.length > PARTICLE_TRAIL_MAX_POINTS) particleTrailPoints.shift();
    particleTrailLast.x = x;
    particleTrailLast.y = y;
    particleTrailLast.time = now;
  }

  function addParticlePulse(x, y, now) {
    particlePulses.push({ x: x, y: y, createdAt: now });
    if (particlePulses.length > PARTICLE_PULSE_MAX_COUNT) particlePulses.shift();
  }

  function drawParticleInteractionFeedback(now) {
    particleTrailPoints = particleTrailPoints.filter(function (point) {
      return now - point.createdAt < PARTICLE_TRAIL_LIFETIME;
    });
    for (var index = 1; index < particleTrailPoints.length; index++) {
      var previous = particleTrailPoints[index - 1];
      var current = particleTrailPoints[index];
      var progress = Math.min(1, (now - previous.createdAt) / PARTICLE_TRAIL_LIFETIME);
      var alpha = particleAlpha(Math.pow(1 - progress, 2) * .34);
      particleContext.beginPath();
      particleContext.moveTo(previous.x, previous.y);
      particleContext.lineTo(current.x, current.y);
      particleContext.strokeStyle = "rgba(" + particlePalette.link + "," + alpha + ")";
      particleContext.lineWidth = .7 + (1 - progress) * .8;
      particleContext.stroke();
    }

    particlePulses = particlePulses.filter(function (pulse) {
      return now - pulse.createdAt < PARTICLE_PULSE_LIFETIME;
    });
    particlePulses.forEach(function (pulse) {
      var progress = Math.min(1, (now - pulse.createdAt) / PARTICLE_PULSE_LIFETIME);
      var eased = 1 - Math.pow(1 - progress, 3);
      var alpha = particleAlpha(Math.pow(1 - progress, 2) * .48);
      var radius = 6 + PARTICLE_PULSE_MAX_RADIUS * eased;
      particleContext.beginPath();
      particleContext.arc(pulse.x, pulse.y, radius, 0, Math.PI * 2);
      particleContext.strokeStyle = "rgba(" + particlePalette.link + "," + alpha + ")";
      particleContext.lineWidth = 1 + (1 - progress) * 1.4;
      particleContext.stroke();
      if (progress < .2) {
        particleContext.beginPath();
        particleContext.arc(pulse.x, pulse.y, 2.6 + progress * 16, 0, Math.PI * 2);
        particleContext.fillStyle = "rgba(" + particlePalette.link + "," + (1 - progress / .2) * .7 + ")";
        particleContext.fill();
      }
    });
  }

  function drawParticleField(dt, animate) {
    if (!particleContext || !particleWidth || !particleHeight) return;
    particleContext.clearRect(0, 0, particleWidth, particleHeight);
    if (animate) particles.forEach(function (particle) { updateParticle(particle, dt); });
    if (animate) {
      buildParticleBuckets();
      drawParticleLinks();
      drawParticleInteractionFeedback(performance.now());
      particleContext.fillStyle = particlePalette.dot;
    } else {
      particleContext.fillStyle = particlePalette.staticDot;
    }
    particles.forEach(function (particle) {
      particleContext.beginPath();
      particleContext.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
      particleContext.fill();
    });
  }

  function particleAnimationLoop(timestamp) {
    if (!particleRunning) return;
    particleFrame = requestAnimationFrame(particleAnimationLoop);
    if (particleLastFrameTime && timestamp - particleLastFrameTime < PARTICLE_FRAME_INTERVAL) return;
    var dt = particleLastFrameTime ? Math.min((timestamp - particleLastFrameTime) / 1000, .05) : 1 / PARTICLE_TARGET_FPS;
    particleLastFrameTime = timestamp;
    drawParticleField(dt, true);
  }

  function startParticleField() {
    if (particleRunning || !particleContext) return;
    particleRunning = true;
    particleLastFrameTime = 0;
    particleFrame = requestAnimationFrame(particleAnimationLoop);
  }

  function stopParticleField(clear) {
    particleRunning = false;
    particleLastFrameTime = 0;
    if (particleFrame) cancelAnimationFrame(particleFrame);
    particleFrame = 0;
    particleMouse.active = false;
    resetParticleInteractions();
    if (clear && particleContext) particleContext.clearRect(0, 0, particleWidth, particleHeight);
  }

  function canAnimateParticleField() {
    return !!particleContext && !!finePointerQuery && finePointerQuery.matches &&
      !(reducedMotionQuery && reducedMotionQuery.matches) && window.innerWidth > 720 && !document.hidden;
  }

  function refreshParticleCapability() {
    if (!particleContext) return;
    if (canAnimateParticleField()) {
      startParticleField();
      return;
    }
    stopParticleField(true);
    if (!document.hidden && window.innerWidth > 720 &&
        reducedMotionQuery && reducedMotionQuery.matches) drawParticleField(0, false);
  }

  function scheduleParticleResize() {
    if (particleResizeFrame) cancelAnimationFrame(particleResizeFrame);
    particleResizeFrame = requestAnimationFrame(function () {
      particleResizeFrame = 0;
      resizeParticleField();
      refreshParticleCapability();
    });
  }

  function handleParticlePointerMove(event) {
    if (!particleRunning || event.pointerType !== "mouse") return;
    particleMouse.x = event.clientX;
    particleMouse.y = event.clientY;
    particleMouse.active = true;
    addParticleTrailPoint(event.clientX, event.clientY, performance.now());
  }

  function handleParticlePointerDown(event) {
    if (!particleRunning || event.pointerType !== "mouse" || event.button !== 0) return;
    addParticlePulse(event.clientX, event.clientY, performance.now());
  }

  function clearParticlePointer() {
    particleMouse.active = false;
    particleTrailLast.time = 0;
  }

  function initParticleField() {
    if (!particleCanvas || typeof particleCanvas.getContext !== "function") return;
    particleContext = particleCanvas.getContext("2d");
    if (!particleContext) return;
    refreshParticlePalette();
    resizeParticleField();
    window.addEventListener("pointermove", handleParticlePointerMove, { passive: true });
    window.addEventListener("pointerdown", handleParticlePointerDown, { passive: true });
    window.addEventListener("pointerout", function (event) {
      if (!event.relatedTarget) clearParticlePointer();
    });
    window.addEventListener("blur", clearParticlePointer);
    window.addEventListener("resize", scheduleParticleResize, { passive: true });
    document.addEventListener("visibilitychange", refreshParticleCapability);
    listenMediaQuery(finePointerQuery, refreshParticleCapability);
    listenMediaQuery(reducedMotionQuery, refreshParticleCapability);
    refreshParticleCapability();
  }

  function updateRuntimeModel(apiType, model, providerID) {
    if (!model) return;
    var matched = Array.prototype.find.call(modelSelect.options, function (option) { return option.dataset.providerId === (providerID || "") && option.dataset.model === model; });
    if (!matched) {
      matched = new Option(model, (providerID || "runtime") + "\u001f" + model);
      matched.dataset.providerId = providerID || "";
      matched.dataset.model = model;
      modelSelect.add(matched);
    }
    modelSelect.value = matched.value;
    modelSelect.title = (providerID || apiType || "llm") + " · " + model;
  }

  function renderProviderSelectors() {
    modelSelect.innerHTML = "";
    providerSettingsState.providers.forEach(function (provider) {
      var group = document.createElement("optgroup");
      group.label = provider.name;
      provider.models.forEach(function (model) {
        var option = new Option(model, provider.id + "\u001f" + model);
        option.dataset.providerId = provider.id;
        option.dataset.model = model;
        group.appendChild(option);
      });
      modelSelect.appendChild(group);
    });
    var active = providerSettingsState.providers.find(function (provider) { return provider.id === providerSettingsState.active_provider; });
    if (active) modelSelect.value = active.id + "\u001f" + active.default_model;
    modelSelect.disabled = modelSelect.options.length === 0;
  }

  async function loadProviderSettings() {
    try {
      var response = await fetch(workspaceScopedURL("/api/v1/webui/providers"), { headers: { "Accept": "application/json" } });
      if (!response.ok) return;
      providerSettingsState = await response.json();
      renderProviderSelectors();
    } catch (_) {}
  }

  async function selectRuntimeModel() {
    var option = modelSelect.options[modelSelect.selectedIndex];
    if (!option || !option.dataset.providerId || !option.dataset.model) return;
    var response = await fetch(workspaceScopedURL("/api/v1/webui/provider-selection"), {
      method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ provider_id: option.dataset.providerId, model: option.dataset.model, session_id: sessionId })
    });
    var payload = await response.json();
    if (!response.ok) throw new Error(payload.error || "切换模型失败");
    providerSettingsState.active_provider = option.dataset.providerId;
    var active = providerSettingsState.providers.find(function (provider) { return provider.id === option.dataset.providerId; });
    if (active) active.default_model = option.dataset.model;
    updateRuntimeModel(payload.api_type, payload.model, payload.provider_id);
  }

  function beginRuntimeModelSelection() {
    modelSelect.disabled = true;
    var selection = selectRuntimeModel().then(function () {
      return true;
    }, function (error) {
      statusEl.textContent = error.message;
      statusEl.classList.add("error");
      loadRuntimeModel();

  function workspaceDirectoryState(directoryPath) {
    if (!workspaceDirectories[directoryPath]) {
      workspaceDirectories[directoryPath] = {
        path: directoryPath,
        entries: [],
        nextOffset: null,
        loaded: false,
        loading: false,
        error: "",
        requestID: 0
      };
    }
    return workspaceDirectories[directoryPath];
  }

  async function workspaceFetchJSON(url, options) {
    options = options || { headers: { "Accept": "application/json" } };
    options.cache = "no-store";
    var response = await fetch(url, options);
    if (!response.ok) {
      var message = "HTTP " + response.status;
      try {
        var errorPayload = await response.json();
        if (errorPayload && errorPayload.error) message = errorPayload.error;
      } catch (_) {}
      throw new Error(message);
    }
    return response.json();
  }

  async function requestWorkspaceDirectoryPage(directoryPath, offset) {
    var url = workspaceScopedURL("/api/v1/webui/workspace?path=" + encodeURIComponent(directoryPath) + "&offset=" + offset);
    var payload = await workspaceFetchJSON(url);
    return {
      entries: payload && Array.isArray(payload.entries) ? payload.entries : [],
      nextOffset: payload && typeof payload.next_offset === "number" ? payload.next_offset : null
    };
  }

  async function loadWorkspaceDirectory(directoryPath, append, preservePages) {
    var state = workspaceDirectoryState(directoryPath);
    if (state.loading && append) return;
    var priorEntries = state.entries.slice();
    var priorNextOffset = state.nextOffset;
    var pages = preservePages ? Math.max(1, Math.ceil(priorEntries.length / 250)) : 1;
    var requestID = ++state.requestID;
    state.loading = true;
    state.error = "";
    renderWorkspaceTree();
    try {
      var gathered = append ? state.entries.slice() : [];
      var nextOffset = append ? state.nextOffset : 0;
      if (append && typeof nextOffset !== "number") return;
      for (var pageIndex = 0; pageIndex < pages && typeof nextOffset === "number"; pageIndex++) {
        var page = await requestWorkspaceDirectoryPage(directoryPath, nextOffset);
        if (requestID !== state.requestID) return;
        var seen = Object.create(null);
        gathered.forEach(function (entry) { seen[entry.path] = true; });
        page.entries.forEach(function (entry) {
          if (!seen[entry.path]) {
            seen[entry.path] = true;
            gathered.push(entry);
          }
        });
        nextOffset = page.nextOffset;
        if (append) break;
      }
      if (requestID !== state.requestID) return;
      state.entries = gathered;
      state.nextOffset = nextOffset;
      state.loaded = true;
    } catch (error) {
      if (requestID !== state.requestID) return;
      if (!append && priorEntries.length) {
        state.entries = priorEntries;
        state.nextOffset = priorNextOffset;
      }
      state.error = error && error.message ? error.message : String(error);
    } finally {
      if (requestID === state.requestID) {
        state.loading = false;
        renderWorkspaceTree();
      }
    }
  }

  function createWorkspaceEntryIcon(type) {
    var icon = document.createElement("span");
    icon.className = "workspace-entry-icon" + (type === "symlink" || type === "other" ? " muted" : "");
    icon.setAttribute("aria-hidden", "true");
    icon.innerHTML = iconMarkup(type === "directory" ? "folder" : (type === "symlink" ? "link" : "file"));
    return icon;
  }

  function appendWorkspaceInlineState(text, depth, error) {
    var state = document.createElement("div");
    state.className = "workspace-inline-state" + (error ? " error" : "");
    state.style.setProperty("--tree-depth", depth);
    state.textContent = text;
    workspaceTree.appendChild(state);
  }

  function appendWorkspaceDirectory(directoryPath, depth) {
    var state = workspaceDirectoryState(directoryPath);
    state.entries.forEach(function (entry) {
      var row = document.createElement("button");
      row.type = "button";
      row.className = "workspace-row" + (workspaceCurrentPreview && workspaceCurrentPreview.path === entry.path ? " active" : "");
      row.style.setProperty("--tree-depth", depth);
      row.setAttribute("role", "treeitem");
      row.setAttribute("aria-level", String(depth + 1));
      row.title = entry.path;

      var chevron = document.createElement("span");
      chevron.className = "workspace-chevron";
      if (entry.type === "directory") {
        var expanded = Boolean(workspaceExpanded[entry.path]);
        chevron.innerHTML = iconMarkup("chevron-right");
        chevron.classList.toggle("expanded", expanded);
        row.setAttribute("aria-expanded", expanded ? "true" : "false");
      }
      row.appendChild(chevron);
      row.appendChild(createWorkspaceEntryIcon(entry.type));

      var name = document.createElement("span");
      name.className = "workspace-entry-name";
      name.textContent = entry.name;
      row.appendChild(name);
      if (entry.type === "file") {
        var size = document.createElement("span");
        size.className = "workspace-entry-size";
        size.textContent = formatBytes(entry.size);
        row.appendChild(size);
      }

      if (entry.type === "directory") {
        row.addEventListener("click", function () {
          workspaceExpanded[entry.path] = !workspaceExpanded[entry.path];
          var child = workspaceDirectoryState(entry.path);
          if (workspaceExpanded[entry.path] && !child.loaded && !child.loading) {
            loadWorkspaceDirectory(entry.path, false, false);
          } else {
            renderWorkspaceTree();
          }
        });
      } else if (entry.type === "file") {
        row.addEventListener("click", function () { openWorkspacePreview(entry); });
      } else {
        row.disabled = true;
        row.title = entry.path + "（符号链接或特殊文件不可浏览）";
      }
      workspaceTree.appendChild(row);

      if (entry.type === "directory" && workspaceExpanded[entry.path]) {
        var childState = workspaceDirectoryState(entry.path);
        if (childState.loaded) appendWorkspaceDirectory(entry.path, depth + 1);
        if (childState.loading) appendWorkspaceInlineState("加载中…", depth + 1, false);
        if (childState.error) appendWorkspaceInlineState("加载失败：" + childState.error, depth + 1, true);
      }
    });

    if (typeof state.nextOffset === "number") {
      var more = document.createElement("button");
      more.type = "button";
      more.className = "workspace-load-more";
      more.style.setProperty("--tree-depth", depth);
      more.textContent = state.loading ? "加载中…" : "加载更多";
      more.disabled = state.loading;
      more.addEventListener("click", function () { loadWorkspaceDirectory(directoryPath, true, false); });
      workspaceTree.appendChild(more);
    }
  }

  function renderWorkspaceTree() {
    var scrollTop = workspaceTreeScroll.scrollTop;
    workspaceTree.textContent = "";
    workspaceTreeStatus.textContent = "";
    workspaceTreeStatus.classList.remove("error");
    var root = workspaceDirectoryState("");
    if (!root.loaded && root.loading) {
      workspaceTreeStatus.textContent = "正在读取工作区…";
    } else if (root.error && !root.entries.length) {
      workspaceTreeStatus.textContent = "读取失败：" + root.error;
      workspaceTreeStatus.classList.add("error");
    } else if (root.loaded && !root.entries.length) {
      workspaceTreeStatus.textContent = "工作区为空";
    } else {
      appendWorkspaceDirectory("", 0);
      if (root.error) {
        workspaceTreeStatus.textContent = "刷新失败，当前显示上次结果：" + root.error;
        workspaceTreeStatus.classList.add("error");
      }
    }
    workspaceTreeScroll.scrollTop = scrollTop;
  }

  async function refreshWorkspaceTree() {
    if (workspaceRefreshInFlight) return;
    workspaceRefreshInFlight = true;
    workspaceRefresh.disabled = true;
    var paths = Object.keys(workspaceDirectories).filter(function (directoryPath) {
      return workspaceDirectories[directoryPath].loaded || directoryPath === "";
    });
    if (!paths.length) paths = [""];
    try {
      await Promise.all(paths.map(function (directoryPath) {
        return loadWorkspaceDirectory(directoryPath, false, true);
      }));
    } finally {
      workspaceRefreshInFlight = false;
      workspaceRefresh.disabled = false;
    }
  }

  function showWorkspaceTreeView() {

    renderWorkspaceTree();
    requestAnimationFrame(function () { workspaceTreeScroll.scrollTop = workspaceTreeScrollTop; });

  function updateWorkspacePreviewAttachState() {
    var current = workspaceCurrentPreview;
    var duplicate = Boolean(current && pendingFiles.some(function (file) {
      return file.kind === "path" && file.path === current.path;
    }));

  function toolCardList(cards) {

  function updateToolGroupSummary(timeline, cards) {
    var group = timeline && timeline.toolGroup;
    if (!group) return;
    var cardList = toolCardList(cards);
    var running = 0;
    var failed = 0;
    cardList.forEach(function (card) {
      if (card.state === "running") running++;
      if (card.state === "failed") failed++;
    });
    group.root.classList.remove("succeeded", "failed");
    if (running === 0) group.root.classList.add(failed > 0 ? "failed" : "succeeded");
    if (running > 0) {
      group.status.textContent = cardList.length + " 次 · " + running + " 运行中" + (failed > 0 ? " · " + failed + " 失败" : "");
    } else if (failed > 0) {
      group.status.textContent = cardList.length + " 次 · " + failed + " 失败";
    } else {
      group.status.textContent = cardList.length + " 次 · 全部完成";
    }
  }

  function ensureToolGroup(timeline, cards) {

  function updateToolTimeline(bubble, cards, eventName, payload) {

      root.appendChild(button);

      ensureToolGroup(timeline, cards);

    if (payload.arguments) card.arguments.textContent = JSON.stringify(payload.arguments, null, 2);
    if (eventName === "tool_result") {
      var failed = payload.status === "failed";

      var truncated = payload.truncated ? " · 已截断" : "";

      card.result.textContent = payload.preview || (failed ? "工具执行失败" : "（无输出）");
    }
    updateToolGroupSummary(timeline, cards);
  }

  function formatBytes(bytes) {
    if (!bytes) return "0 B";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10 * 1024 ? 1 : 0) + " KiB";

  function pathBaseName(value) {

  function renderPendingAttachments() {
    attachmentTray.textContent = "";
    attachmentTray.hidden = pendingImages.length === 0 && pendingFiles.length === 0;
    pendingImages.forEach(function (image, index) {
      var item = document.createElement("div");

      item.appendChild(preview);
      item.appendChild(remove);
      item.appendChild(badge);
      attachmentTray.appendChild(item);
    });
    pendingFiles.forEach(function (file) {
      var item = document.createElement("div");
      item.className = "attachment-file" + (file.loading ? " loading" : "");
      item.appendChild(createFileIcon());
      var copy = document.createElement("div");
      copy.className = "attachment-file-copy";
      var name = document.createElement("span");
      name.className = "attachment-file-name";
      name.textContent = file.name;
      name.title = file.path || file.name;
      var meta = document.createElement("span");
      meta.className = "attachment-file-meta";
      meta.textContent = file.loading ? "读取中" : (file.kind === "path" ? "服务器路径" + (file.size ? " · " + formatBytes(file.size) : "") : formatBytes(file.size));
      copy.appendChild(name);
      copy.appendChild(meta);
      var remove = document.createElement("button");
      remove.type = "button";
      remove.className = "attachment-remove";
      remove.innerHTML = iconMarkup("x");
      remove.disabled = busy;
      remove.setAttribute("aria-label", "删除文件 " + file.name);
      remove.addEventListener("click", function () { removePendingFile(file.id); });
      item.appendChild(copy);
      item.appendChild(remove);
      attachmentTray.appendChild(item);
    });
    updateWorkspacePreviewAttachState();
  }

  function removePendingImage(id) {
    if (busy) return;
    pendingImages = pendingImages.filter(function (image) {
      if (image.id !== id) return true;
      URL.revokeObjectURL(image.objectURL);
      return false;
    });
    renderPendingAttachments();
  }

  function removePendingFile(id) {
    if (busy) return;
    pendingFiles = pendingFiles.filter(function (file) { return file.id !== id; });
    renderPendingAttachments();
  }

  function clearPendingAttachments() {
    pendingImages.forEach(function (image) { URL.revokeObjectURL(image.objectURL); });
    pendingImages = [];
    pendingImageReads = [];
    pendingFiles = [];
    pendingFileReads = [];
    renderPendingAttachments();
    clearAttachmentError();
  }

  function readAsBase64(file, attachment, failureMessage) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var dataURL = String(reader.result || "");
        var comma = dataURL.indexOf(",");
        if (comma < 0) return reject(new Error(failureMessage));
        attachment.dataBase64 = dataURL.slice(comma + 1);
        attachment.loading = false;
        renderPendingAttachments();
        resolve();
      };
      reader.onerror = function () { reject(new Error(failureMessage)); };
      reader.readAsDataURL(file);
    });
  }

  function addClipboardImages(files) {
    clearAttachmentError();
    var totalBytes = pendingImages.reduce(function (sum, image) { return sum + image.size; }, 0);
    files.forEach(function (file) {
      if (pendingImages.length >= MAX_PENDING_IMAGES) return setAttachmentError("每次最多发送 " + MAX_PENDING_IMAGES + " 张图片");
      if (!ALLOWED_IMAGE_TYPES[file.type]) return setAttachmentError("仅支持 PNG、JPEG 和 GIF 图片");
      if (file.size > MAX_PENDING_IMAGE_BYTES) return setAttachmentError("单张图片不能超过 3 MiB");
      if (totalBytes + file.size > MAX_PENDING_TOTAL_BYTES) return setAttachmentError("图片总大小不能超过 8 MiB");
      totalBytes += file.size;
      var attachment = { id: nextAttachmentID++, mimeType: file.type, size: file.size, dataBase64: "", objectURL: URL.createObjectURL(file), loading: true };
      pendingImages.push(attachment);
      var read = readAsBase64(file, attachment, "读取图片失败").catch(function (error) {
        setAttachmentError(error.message || String(error));
        removePendingImage(attachment.id);
      });
      pendingImageReads.push(read);
    });
    renderPendingAttachments();
  }

  function addLocalFiles(files) {
    clearAttachmentError();
    var totalBytes = pendingFiles.reduce(function (sum, file) { return sum + (Number(file.size) || 0); }, 0);
    Array.prototype.forEach.call(files, function (file) {
      if (pendingFiles.length >= MAX_PENDING_FILES) return setAttachmentError("每次最多添加 " + MAX_PENDING_FILES + " 个文件");
      if (file.size > MAX_PENDING_FILE_BYTES) return setAttachmentError("单个文件不能超过 2 MiB");
      if (totalBytes + file.size > MAX_PENDING_TOTAL_FILE_BYTES) return setAttachmentError("文件总大小不能超过 6 MiB");
      totalBytes += file.size;
      var attachment = { id: nextAttachmentID++, kind: "upload", name: file.name || "未命名文件", size: file.size, dataBase64: "", loading: true };
      pendingFiles.push(attachment);
      var read = readAsBase64(file, attachment, "读取文件失败").catch(function (error) {
        setAttachmentError(error.message || String(error));
        removePendingFile(attachment.id);
      });
      pendingFileReads.push(read);
    });
    renderPendingAttachments();
  }

  function addWorkspacePath(value, size) {
    if (busy) return false;
    clearAttachmentError();
    value = String(value || "").trim().replace(/\\/g, "/");
    if (!value) {
      setAttachmentError("请输入 workspace 内的文件路径");
      return false;
    }
    if (pendingFiles.some(function (file) { return file.kind === "path" && file.path === value; })) {
      setAttachmentError("该 workspace 文件已添加");
      updateWorkspacePreviewAttachState();
      return false;
    }
    if (pendingFiles.length >= MAX_PENDING_FILES) {
      setAttachmentError("每次最多添加 " + MAX_PENDING_FILES + " 个文件");
      return false;
    }
    size = Number(size) || 0;
    if (size > MAX_PENDING_FILE_BYTES) {
      setAttachmentError("单个文件不能超过 2 MiB");
      return false;
    }
    var knownTotalBytes = pendingFiles.reduce(function (sum, file) { return sum + (Number(file.size) || 0); }, 0);
    if (size && knownTotalBytes + size > MAX_PENDING_TOTAL_FILE_BYTES) {
      setAttachmentError("文件总大小不能超过 6 MiB");
      return false;
    }
    pendingFiles.push({ id: nextAttachmentID++, kind: "path", name: pathBaseName(value), path: value, size: size, loading: false });
    renderPendingAttachments();
    return true;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function safeHref(url) {
    var value = String(url || "").trim();
    if (/^(https?:|mailto:)/i.test(value) || /^(#|\/(?!\/)|\.\/|\.\.\/)/.test(value)) {
      return value;
    }
    return "";
  }

  function applyEmphasis(s) {
    return s
      .replace(/~~([^~]+)~~/g, "<del>$1</del>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/__([^_]+)__/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
  }

  function renderInline(source) {
    var tokens = [];
    function stash(html) {
      var token = "\u0000MD" + tokens.length + "\u0000";
      tokens.push(html);
      return token;
    }

    var text = String(source == null ? "" : source);
    text = text.replace(/(`+)([\s\S]*?)\1/g, function (_, ticks, code) {
      return stash("<code>" + escapeHtml(code.trim()) + "</code>");
    });
    text = text.replace(/!\[([^\]]*)\]\(([^\s)]+)(?:\s+["']([^"']*)["'])?\)/g,
      function (_, alt, url, title) {
        var src = safeHref(url);
        if (!src || /^mailto:/i.test(src) || /^#/i.test(src)) return alt;
        return stash('<img class="md-image" src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '"' +
          (title ? ' title="' + escapeHtml(title) + '"' : "") + ' loading="lazy" referrerpolicy="no-referrer">');
      });
    text = text.replace(/\[([^\]]+)\]\(([^\s)]+)(?:\s+["']([^"']*)["'])?\)/g,
      function (_, label, url, title) {
        var href = safeHref(url);
        if (!href) return label + " (" + url + ")";
        var titleAttr = title ? ' title="' + escapeHtml(title) + '"' : "";
        var external = /^https?:/i.test(href) ? ' target="_blank" rel="noopener noreferrer"' : "";
        return stash('<a href="' + escapeHtml(href) + '"' + titleAttr + external + '>' +
          applyEmphasis(escapeHtml(label)) + "</a>");
      });
    text = text.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, function (_, prefix, url) {
      var clean = url.replace(/[.,;:!?]+$/, "");
      var tail = url.slice(clean.length);
      return prefix + stash('<a href="' + escapeHtml(clean) + '" target="_blank" rel="noopener noreferrer">' +
        escapeHtml(clean) + "</a>") + tail;
    });
    text = applyEmphasis(escapeHtml(text));
    return text.replace(/\u0000MD(\d+)\u0000/g, function (_, index) {
      return tokens[Number(index)] || "";
    });
  }

  function isFence(line) {
    return line.match(/^\s*(`{3,}|~{3,})\s*([a-zA-Z0-9_+.-]*)\s*$/);
  }

  function isHorizontalRule(line) {
    return /^\s{0,3}((\*\s*){3,}|(-\s*){3,}|(_\s*){3,})\s*$/.test(line);
  }

  function isListLine(line) {
    return line.match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
  }

  function splitTableRow(line) {
    var value = line.trim();
    if (value.charAt(0) === "|") value = value.slice(1);
    if (value.charAt(value.length - 1) === "|") value = value.slice(0, -1);
    var cells = [];
    var current = "";
    var escaped = false;
    for (var i = 0; i < value.length; i++) {
      var ch = value.charAt(i);
      if (escaped) {
        current += ch;
        escaped = false;
      } else if (ch === "\\") {
        escaped = true;
      } else if (ch === "|") {
        cells.push(current.trim());
        current = "";
      } else {
        current += ch;
      }
    }
    cells.push(current.trim());
    return cells;
  }

  function tableDelimiter(line) {
    var cells = splitTableRow(line);
    if (!cells.length) return null;
    var aligns = [];
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i].replace(/\s/g, "");
      if (!/^:?-{3,}:?$/.test(cell)) return null;
      aligns.push(cell.charAt(0) === ":" && cell.charAt(cell.length - 1) === ":" ? "center" :
        (cell.charAt(cell.length - 1) === ":" ? "right" : "left"));
    }
    return aligns;
  }

  function codeBlock(language, body) {
    var label = language || "code";
    return '<div class="code-block"><div class="code-head"><span>' + escapeHtml(label) +
      '</span><button class="copy-code" type="button">' + iconMarkup("copy") + '<span>复制</span></button></div><pre><code' +
      (language ? ' class="language-' + escapeHtml(language) + '"' : "") + ">" +
      escapeHtml(body.replace(/\n$/, "")) + "</code></pre></div>";
  }

  function renderParagraph(lines) {
    var parts = [];
    for (var i = 0; i < lines.length; i++) {
      var hardBreak = /\s{2}$/.test(lines[i]);
      parts.push(renderInline(lines[i].replace(/\s+$/, "")) + (hardBreak ? "<br>" : " "));
    }
    return "<p>" + parts.join("").trim() + "</p>";
  }

  function beginsBlock(lines, index) {
    var line = lines[index] || "";
    if (!line.trim() || isFence(line) || /^(#{1,6})\s+/.test(line) || /^\s*>/.test(line) ||
        isHorizontalRule(line) || isListLine(line)) return true;
    return index + 1 < lines.length && line.indexOf("|") >= 0 && !!tableDelimiter(lines[index + 1]);
  }

  // Dependency-free safe Markdown renderer. Raw HTML is always escaped. It
  // covers the constructs commonly found in README and generated .md files.
  function renderMarkdown(source) {
    var lines = String(source == null ? "" : source).replace(/\r\n?/g, "\n").split("\n");
    var html = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }

      var fence = isFence(line);
      if (fence) {
        var marker = fence[1];
        var language = fence[2] || "";
        var code = [];
        i++;
        while (i < lines.length && !(new RegExp("^\\s*" + marker.charAt(0) + "{" + marker.length + ",}\\s*$")).test(lines[i])) {
          code.push(lines[i++]);
        }
        if (i < lines.length) i++;
        html.push(codeBlock(language, code.join("\n")));
        continue;
      }

      if (i + 1 < lines.length && /^\s*(=+|-+)\s*$/.test(lines[i + 1]) && lines[i + 1].trim().length >= 3) {
        var setextLevel = lines[i + 1].trim().charAt(0) === "=" ? 1 : 2;
        html.push("<h" + setextLevel + ">" + renderInline(line.trim()) + "</h" + setextLevel + ">");
        i += 2;
        continue;
      }

      var heading = line.match(/^(#{1,6})\s+(.+?)\s*#*$/);
      if (heading) {
        var level = heading[1].length;
        html.push("<h" + level + ">" + renderInline(heading[2]) + "</h" + level + ">");
        i++;
        continue;
      }

      if (isHorizontalRule(line)) {
        html.push("<hr>");
        i++;
        continue;
      }

      if (/^\s*>/.test(line)) {
        var quoted = [];
        while (i < lines.length && (/^\s*>/.test(lines[i]) || !lines[i].trim())) {
          quoted.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        html.push("<blockquote>" + renderMarkdown(quoted.join("\n")) + "</blockquote>");
        continue;
      }

      if (i + 1 < lines.length && line.indexOf("|") >= 0) {
        var aligns = tableDelimiter(lines[i + 1]);
        if (aligns) {
          var headers = splitTableRow(line);
          var rows = [];
          i += 2;
          while (i < lines.length && lines[i].trim() && lines[i].indexOf("|") >= 0) {
            rows.push(splitTableRow(lines[i++]));
          }
          var table = '<div class="table-wrap"><table><thead><tr>';
          headers.forEach(function (cell, column) {
            table += '<th style="text-align:' + (aligns[column] || "left") + '">' + renderInline(cell) + "</th>";
          });
          table += "</tr></thead><tbody>";
          rows.forEach(function (row) {
            table += "<tr>";
            headers.forEach(function (_, column) {
              table += '<td style="text-align:' + (aligns[column] || "left") + '">' + renderInline(row[column] || "") + "</td>";
            });
            table += "</tr>";
          });
          html.push(table + "</tbody></table></div>");
          continue;
        }
      }

      var list = isListLine(line);
      if (list) {
        var ordered = /^\d/.test(list[1]);
        var tag = ordered ? "ol" : "ul";
        var items = [];
        var hasTasks = false;
        while (i < lines.length) {
          var item = isListLine(lines[i]);
          if (!item || /^\d/.test(item[1]) !== ordered) break;
          var body = item[2];
          var task = body.match(/^\[([ xX])\]\s+(.*)$/);
          if (task) {
            hasTasks = true;
            body = '<input type="checkbox" disabled' + (task[1].toLowerCase() === "x" ? " checked" : "") + ">" + renderInline(task[2]);
          } else {
            body = renderInline(body);
          }
          items.push("<li>" + body + "</li>");
          i++;
        }
        html.push("<" + tag + (hasTasks ? ' class="task-list"' : "") + ">" + items.join("") + "</" + tag + ">");
        continue;
      }

      var paragraph = [line];
      i++;
      while (i < lines.length && !beginsBlock(lines, i)) {
        paragraph.push(lines[i++]);
      }
      html.push(renderParagraph(paragraph));
    }
    return html.join("");
  }

  function complexTaskNotice(text) {
    var match = String(text || "").match(/^Agent stopped: reached maximum of (\d+) iterations without completing\.$/);
    if (!match) return "";
    return [

      "",
      "本轮已触达失控保险上限（" + match[1] + " 次迭代）。默认已开启自动压缩续跑，正常很难碰到这个上限；你可以继续发送“继续”，我会沿当前会话接着处理。如确实需要更长的单轮，可在 `.env` 中调大 `AGENT_MAX_ITERATIONS` 后重启服务。"
    ].join("\n");
  }

  function parseSSE(raw) {

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var helper = document.createElement("textarea");
      helper.value = text;
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.select();
      try {

        reject(error);
      } finally {
        helper.remove();
      }
    });
  }

  function addMessageMeta(bubble, generation) {
    var stack = bubble && bubble.parentElement;
    if (!stack) return;
    var previous = stack.querySelector(".message-meta");
    if (previous) previous.remove();
    if (!generation) return;

    var firstTokenLatency = Number(generation.first_token_latency_ms);
    var tokensPerSecond = Number(generation.tokens_per_second);
    var parts = [];
    if (isFinite(firstTokenLatency) && firstTokenLatency > 0) {
      parts.push("首字 " + Math.round(firstTokenLatency) + " ms");
    }
    if (isFinite(tokensPerSecond) && tokensPerSecond > 0) {
      parts.push("约 " + tokensPerSecond.toFixed(1).replace(/\.0$/, "") + " token/s");
    }
    if (!parts.length) return;

    var row = document.createElement("div");
    row.className = "message-meta";
    row.textContent = parts.join(" · ");
    row.setAttribute("aria-label", row.textContent);

    var details = [];
    var completionTokens = Number(generation.completion_tokens);
    var reasoningTokens = Number(generation.reasoning_tokens);
    var generationDuration = Number(generation.generation_duration_ms);
    if (isFinite(completionTokens) && completionTokens > 0) details.push("输出 " + Math.round(completionTokens) + " tokens");
    if (isFinite(reasoningTokens) && reasoningTokens > 0) details.push("其中推理 " + Math.round(reasoningTokens) + " tokens");
    if (isFinite(generationDuration) && generationDuration > 0) details.push("生成区间 " + Math.round(generationDuration) + " ms");
    if (details.length) row.title = details.join(" · ");
    stack.appendChild(row);
  }
